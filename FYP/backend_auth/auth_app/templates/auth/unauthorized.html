{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unauthorized | Faculty Tasks Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #14304b;
      --teal: #1d8f8a;
      --gray: #4a6070;
      --bg: #f4f8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #e8f3ff 0, #f8fbff 60%, #f8fbff 100%);
      color: var(--navy);
      display: grid;
      place-items: center;
      padding: 28px 12px;
    }
    .card {
      background: #fff;
      padding: 34px 28px;
      border-radius: 18px;
      box-shadow: 0 28px 64px rgba(20, 48, 75, 0.14);
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0 0 18px; color: var(--gray); line-height: 1.5; }
    a { display: inline-block; margin-top: 6px; color: var(--teal); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access Restricted</h1>
    <p>Only SZABIST Islamabad CS faculty accounts are allowed.</p>
    <a href="{% url 'auth_app:login' %}">Return to Login</a>
  </div>
</body>
</html>
